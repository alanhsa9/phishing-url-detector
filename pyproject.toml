[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "phishing_detector"
version = "0.0.1"
description = "Machine learning pipeline for malicious and phishing URL classification using the PhiUSIIL dataset"
authors = [
  { name = "Alan Herrera" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["phishing_detector"]
include = ["pyproject.toml", "phishing_detector/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["phishing_detector"]
force-sort-within-sections = true

